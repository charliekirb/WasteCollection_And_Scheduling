<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>LinisPanabo — Profile</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="resident.css">
</head>
<body>

<div class="phone-shell">

  <div class="status-bar">
    <span>11:11</span>
    <span>📶 🔋</span>
  </div>

  <div class="app-topbar">
    <p class="page-heading">My Profile</p>
  </div>

  <div class="app-content">

    <div class="profile-header">
      <div class="profile-avatar"><img src="../assets/bai.png" alt="Juan Dela Cruz profile photo"/></div>
      <p class="p-name">Buseng</p>
      <p class="p-role">Resident</p>
    </div>

    <div class="clay-card">
      <div class="profile-row">
        <span class="p-label">Barangay</span>
        <span class="p-value">New Visayas</span>
      </div>
      <div class="profile-row">
        <span class="p-label">Purok</span>
        <span class="p-value">Purok 6</span>
      </div>
      <div class="profile-row">
        <span class="p-label">Email</span>
        <span class="p-value">buseng@email.com</span>
      </div>
      <div class="profile-row">
        <span class="p-label">Phone Number</span>
        <span class="p-value">09123456789</span>
      </div>
    </div>

    <div class="profile-actions">
      <button class="btn-edit">Edit Profile</button>
      <button class="btn-logout" onclick="window.location.href='../login.html'">Logout</button>
    </div>

  </div>

  <div class="bottom-nav">
    <a href="home.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
    </a>
    <a href="schedule.html" class="nav-item">
      <span class="nav-icon">📅</span>
      <span class="nav-label">Schedule</span>
    </a>
    <a href="report.html" class="nav-item">
      <span class="nav-icon">⚠️</span>
      <span class="nav-label">Report</span>
    </a>
    <a href="notifications.html" class="nav-item">
      <span class="nav-icon">🔔</span>
      <span class="nav-label">Alerts</span>
    </a>
    <a href="profile.html" class="nav-item active">
      <span class="nav-icon">👤</span>
      <span class="nav-label">Profile</span>
    </a>
  </div>

</div>

</body>
</html>
