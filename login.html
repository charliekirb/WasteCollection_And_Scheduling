<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>PanaWISER — Sign in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <div class="brand-header">
    <div class="brand-mark"><img src="assets/Pana.png" alt="PanaWISER logo"/></div>
    <p class="brand-name">PanaWISER</p>
    <p class="brand-tag">Waste Collection Scheduling<br/>and Monitoring System</p>
  </div>

  <div class="partner-row">
    <img src="assets/PanaboLogo.png" alt="Panabo City seal"/>
    <span>An official system of <strong>CENRO</strong>, City of Panabo</span>
  </div>

  <div class="role-tabs">
    <button id="role-cenro" class="role-btn">CENRO</button>
    <button id="role-brgy" class="role-btn">Barangay</button>
    <button id="role-res" class="role-btn">Resident</button>
  </div>

  <div id="form-area"></div>

  <p class="footer-note">Panabo City, Davao del Norte<br/>&quot;Service to Panaboans, Service to God&quot;</p>
</div>

<script>
const brgyOptions = [
  "A. O. Floirendo","Buenavista","Cacao","Cagangohan","Consolacion","Dapco",
  "Datu Abdul Dadia","Gredu (Poblacion)","J.P. Laurel","Kasilak","Katipunan",
  "Katualan","Kauswagan","Kiotoy","Little Panay","Lower Panaga (Roxas)",
  "Mabunao","Maduao","Malativas","Manay","Nanyo","New Malaga (Dalisay)",
  "New Malitbog","New Pandan (Poblacion)","New Visayas","Quezon","Salvacion",
  "San Francisco (Poblacion)","San Nicolas","San Pedro","San Roque","San Vicente",
  "Santa Cruz","Santo Niño (Poblacion)","Sindaton","Southern Davao","Tagpore",
  "Tibungol","Upper Licanan","Waterfall"
].map(b => `<option>Barangay ${b}</option>`).join('');

const forms = {
  cenro: () => `
    <div class="field-wrap">
      <p class="field-label">Employee ID or email</p>
      <input type="text" placeholder="cenro.staff@panabocity.gov.ph"/>
    </div>
    <div class="field-wrap">
      <p class="field-label">Password</p>
      <input type="password" placeholder="Enter your password"/>
    </div>
    <div class="helper-row"><a class="helper-link" href="#">Forgot password?</a></div>
    <button class="primary-btn" onclick="window.location.href='cenro/dashboard.html'">Sign in as CENRO admin</button>
  `,
  brgy: () => `
    <div class="field-wrap">
      <p class="field-label">Barangay office</p>
      <select>${brgyOptions}</select>
    </div>
    <div class="field-wrap">
      <p class="field-label">Staff ID or email</p>
      <input type="text" placeholder="staff.id@panabocity.gov.ph"/>
    </div>
    <div class="field-wrap">
      <p class="field-label">Password</p>
      <input type="password" placeholder="Enter your password"/>
    </div>
    <div class="helper-row"><a class="helper-link" href="#">Forgot password?</a></div>
    <button class="primary-btn" onclick="window.location.href='barangay/dashboard.html'">Sign in as barangay official</button>
  `,
  res: () => `
    <div class="field-wrap">
      <p class="field-label">Mobile number or email</p>
      <input type="text" placeholder="09XX XXX XXXX"/>
    </div>
    <div class="field-wrap">
      <p class="field-label">Password</p>
      <input type="password" placeholder="Enter your password"/>
    </div>
    <div class="helper-row"><a class="helper-link" href="#">Forgot password?</a></div>
    <button class="primary-btn" onclick="window.location.href='resident/home.html'">Sign in</button>
    <p class="register-note">New resident? <a href="register.html">Create an account</a></p>
  `
};

let role = 'res';

function render() {
  document.getElementById('role-cenro').classList.toggle('active', role === 'cenro');
  document.getElementById('role-brgy').classList.toggle('active', role === 'brgy');
  document.getElementById('role-res').classList.toggle('active', role === 'res');
  document.getElementById('form-area').innerHTML = forms[role]();
}

document.getElementById('role-cenro').addEventListener('click', () => { role = 'cenro'; render(); });
document.getElementById('role-brgy').addEventListener('click', () => { role = 'brgy'; render(); });
document.getElementById('role-res').addEventListener('click', () => { role = 'res'; render(); });
render();
</script>

</body>
</html>
